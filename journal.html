<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Jurnal - Leaa ❤️</title>
    <link rel="icon" href="icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Header */
        .header-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            padding: 30px;
            text-align: center;
        }

        .header-section h1 {
            color: #ff4b6e;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header-section p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #ff4b6e;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #ff4b6e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 75, 110, 0.3);
        }

        /* Search Container */
        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .search-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #ff4b6e;
            box-shadow: 0 0 0 0.2rem rgba(255, 75, 110, 0.25);
        }

        .search-btn {
            background: #ff4b6e;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #ff3356;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
        }

        /* Database Selection */
        .database-selection {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .database-btn {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .database-btn:hover {
            border-color: #ff4b6e;
            color: #ff4b6e;
            background: rgba(255, 75, 110, 0.1);
        }

        .database-btn.active {
            background: #ff4b6e;
            color: white;
            border-color: #ff4b6e;
        }

        /* Results Container */
        .results-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 75, 110, 0.2);
        }

        .result-title {
            color: #ff4b6e;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-title a {
            color: #ff4b6e;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .result-title a:hover {
            color: #ff3356;
            text-decoration: underline;
        }

        .result-authors {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .result-abstract {
            color: #555;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .result-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #888;
        }

        .result-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results i {
            font-size: 4rem;
            color: #ff4b6e;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff4b6e;
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Quick Links */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .quick-link-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .quick-link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 75, 110, 0.2);
        }

        .quick-link-icon {
            font-size: 2.5rem;
            color: #ff4b6e;
            margin-bottom: 10px;
        }

        .quick-link-title {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 2rem;
            }

            .search-form {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .back-btn {
                top: 10px;
                left: 10px;
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <i class="bi bi-arrow-left"></i> Kembali
    </a>

    <!-- Header -->
    <div class="container-fluid">
        <div class="header-section">
            <h1><i class="bi bi-journal-text"></i> Pencarian Jurnal</h1>
            <p>Cari jurnal ilmiah untuk membantu kamu menyelesaikan laporan</p>
        </div>
    </div>

    <!-- Search Container -->
    <div class="search-container">
        <div class="search-card">
            <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Masukkan kata kunci jurnal yang ingin dicari..."
                    required
                >
                <button type="submit" class="search-btn">
                    <i class="bi bi-search"></i> Cari
                </button>
            </form>

            <div class="database-selection">
                <button class="database-btn active" data-db="scholar" onclick="selectDatabase('scholar')">
                    <i class="bi bi-google"></i> Google Scholar
                </button>
                <button class="database-btn" data-db="pubmed" onclick="selectDatabase('pubmed')">
                    <i class="bi bi-book"></i> PubMed
                </button>
                <button class="database-btn" data-db="ieee" onclick="selectDatabase('ieee')">
                    <i class="bi bi-cpu"></i> IEEE Xplore
                </button>
                <button class="database-btn" data-db="springer" onclick="selectDatabase('springer')">
                    <i class="bi bi-journal"></i> Springer
                </button>
            </div>

            <div class="quick-links">
                <a href="https://scholar.google.com" target="_blank" class="quick-link-card">
                    <i class="bi bi-google quick-link-icon"></i>
                    <div class="quick-link-title">Google Scholar</div>
                </a>
                <a href="https://pubmed.ncbi.nlm.nih.gov" target="_blank" class="quick-link-card">
                    <i class="bi bi-book quick-link-icon"></i>
                    <div class="quick-link-title">PubMed</div>
                </a>
                <a href="https://ieeexplore.ieee.org" target="_blank" class="quick-link-card">
                    <i class="bi bi-cpu quick-link-icon"></i>
                    <div class="quick-link-title">IEEE Xplore</div>
                </a>
                <a href="https://link.springer.com" target="_blank" class="quick-link-card">
                    <i class="bi bi-journal quick-link-icon"></i>
                    <div class="quick-link-title">Springer</div>
                </a>
            </div>
        </div>
    </div>

    <!-- Results Container -->
    <div class="results-container" id="resultsContainer">
        <div class="no-results" id="noResults">
            <i class="bi bi-search"></i>
            <h4>Mulai pencarian jurnal</h4>
            <p>Masukkan kata kunci di atas untuk mencari jurnal ilmiah</p>
        </div>
    </div>

    <script>
        let selectedDatabase = 'scholar';

        function selectDatabase(db) {
            selectedDatabase = db;
            document.querySelectorAll('.database-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-db="${db}"]`).classList.add('active');
        }

        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                return;
            }

            // Show loading
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading">
                    <i class="bi bi-arrow-repeat"></i>
                    <p style="margin-top: 15px;">Mencari jurnal...</p>
                </div>
            `;

            // Redirect to search engine based on selected database
            setTimeout(() => {
                let searchUrl = '';
                
                switch(selectedDatabase) {
                    case 'scholar':
                        searchUrl = `https://scholar.google.com/scholar?q=${encodeURIComponent(query)}`;
                        break;
                    case 'pubmed':
                        searchUrl = `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(query)}`;
                        break;
                    case 'ieee':
                        searchUrl = `https://ieeexplore.ieee.org/search/searchresult.jsp?queryText=${encodeURIComponent(query)}`;
                        break;
                    case 'springer':
                        searchUrl = `https://link.springer.com/search?query=${encodeURIComponent(query)}`;
                        break;
                    default:
                        searchUrl = `https://scholar.google.com/scholar?q=${encodeURIComponent(query)}`;
                }

                // Show results with link
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="result-card">
                        <div class="result-title">
                            <i class="bi bi-check-circle-fill" style="color: #28a745;"></i> Pencarian Siap!
                        </div>
                        <p style="margin: 20px 0; color: #666;">
                            Klik tombol di bawah untuk membuka hasil pencarian di ${getDatabaseName(selectedDatabase)}:
                        </p>
                        <a href="${searchUrl}" target="_blank" class="search-btn" style="display: inline-block; text-decoration: none;">
                            <i class="bi bi-box-arrow-up-right"></i> Buka Hasil Pencarian
                        </a>
                        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
                            <p style="color: #888; font-size: 0.9rem;">
                                <i class="bi bi-info-circle"></i> 
                                Tips: Gunakan kata kunci yang spesifik untuk hasil yang lebih akurat. 
                                Contoh: "machine learning" AND "neural network" untuk mencari jurnal yang mengandung kedua istilah tersebut.
                            </p>
                        </div>
                    </div>
                `;
            }, 1000);
        }

        function getDatabaseName(db) {
            const names = {
                'scholar': 'Google Scholar',
                'pubmed': 'PubMed',
                'ieee': 'IEEE Xplore',
                'springer': 'Springer'
            };
            return names[db] || 'Google Scholar';
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch(e);
            }
        });
    </script>
</body>
</html>
