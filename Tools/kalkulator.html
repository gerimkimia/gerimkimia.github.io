<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kimia - Leaa ❤️</title>
    <link rel="icon" href="../icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Library/style.css">
</head>
<body>
    <!-- Back Button -->
    <a href="../index.html" class="back-btn">
        <i class="bi bi-arrow-left"></i> Kembali
    </a>
    
    <div class="container-fluid">
        <!-- Header -->
        <div class="row">
            <div class="col-12">
                <div class="header-section text-center py-4 mb-4">
                    <h1 class="display-4 fw-bold">KALKULATOR KIMIA</h1>
                    <p class="lead">Dengan Alur Perhitungan</p>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Menu Sidebar -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-list-ul"></i> MENU UTAMA</h5>
                    </div>
                    <div class="list-group list-group-flush">
                        <button class="list-group-item list-group-item-action" onclick="showMenu('mr')">
                            Menghitung Mr
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('mol-massa')">
                            Konversi Mol ↔ Massa
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('mol-partikel')">
                            Konversi Mol ↔ Partikel
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('stp')">
                            Volume Gas STP
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('ideal-gas')">
                            Hukum Gas Ideal
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('combined-gas')">
                            Hukum Gas Gabungan
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('molarity')">
                            Molaritas Larutan
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('dilution')">
                            Pengenceran Larutan
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('mass-percent')">
                            Persen Massa
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('stoichiometry')">
                            Stoikiometri
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="showMenu('limiting')">
                            Pereaksi Pembatas
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-9 col-md-8">
                <div id="content-area">
                    <!-- Default Welcome Message -->
                    <div class="card shadow-sm">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-flask display-1 text-primary"></i>
                            <h3 class="mt-3">Selamat Datang!</h3>
                            <p class="text-muted">Pilih menu di sebelah kiri untuk memulai perhitungan kimia</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Alert Popup -->
    <div id="custom-alert-overlay" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <div class="custom-alert-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <div class="custom-alert-content">
                <h5 class="custom-alert-title">Peringatan</h5>
                <p class="custom-alert-message"></p>
            </div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">
                <i class="bi bi-check-circle"></i> OK
            </button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Library/script.js"></script>
</body>
</html>
